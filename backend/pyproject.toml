[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nepse-alert"
version = "1.0.0"
description = "NepseRadar - NEPSE Market News & Stock Suggestion Platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["nepse_alert*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
